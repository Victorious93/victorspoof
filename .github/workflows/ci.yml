name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests
        run: ./gradlew :backend:test --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: backend-test-reports, path: backend/build/reports/tests, if-no-files-found: ignore }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Verify debug signing cert
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: victorspoof-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-reports, path: "app/build/reports/**", if-no-files-found: ignore }
